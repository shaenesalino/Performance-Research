<title>Grade 1 — Term 1 Reviewer</title>
<style>
:root{--ink:#1f2328;--acc:#1f4e79;--acc2:#8a5a1f;--line:#d4d9df;--grey:#6b7280;
 --ok:#1f7a3d;--no:#b3261e;--bg:#f6f7f9;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
.wrap{max-width:840px;margin:0 auto;padding:0 14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 0 0;text-align:center}
header h1{margin:0;font-size:25px;color:var(--acc)}
header p{margin:3px 0 0;color:var(--grey);font-size:15px}
.namebar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.namebar label{flex:1 1 150px;font-size:13px;color:var(--grey);text-align:left}
.namebar input{width:100%;font-size:17px;padding:9px 10px;border:1px solid var(--line);
 border-radius:9px;margin-top:3px;font-family:inherit}
.tabs{display:flex;gap:0;border-top:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:104px;padding:14px 10px;font-size:16px;font-weight:600;background:#fff;border:0;
 border-bottom:3px solid transparent;color:var(--grey);font-family:inherit;cursor:pointer}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.tab.on[data-s="mk"],.tab.on[data-s="gm"],.tab.on[data-s="lg"],.tab.on[data-s="rd"]{color:var(--acc2);border-bottom-color:var(--acc2)}
.weekbar{background:var(--acc);color:#fff;font-weight:700;font-size:16px;padding:11px 14px;
 border-radius:9px;margin:24px 0 12px}
body.mk .weekbar,body.gm .weekbar,body.lg .weekbar,body.rd .weekbar{background:var(--acc2)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.sheet h3{margin:0;font-size:16px;color:var(--acc)}
body.mk .sheet h3,body.gm .sheet h3,body.lg .sheet h3,body.rd .sheet h3{color:var(--acc2)}
.dir{margin:4px 0 12px;font-size:14px;color:var(--grey)}
.box{border:1px solid var(--line);border-radius:9px;background:#fafbfc;padding:10px 12px;
 margin:0 0 12px;font-size:16px;line-height:1.7}
.item{padding:10px 0;border-top:1px solid #eef0f3}
.item:first-of-type{border-top:0}
.q{display:flex;gap:8px;align-items:flex-start;font-size:17px}
.n{font-weight:700;min-width:30px;color:var(--acc)}
body.mk .n,body.gm .n,body.lg .n,body.rd .n{color:var(--acc2)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0 0 38px}
.opt{min-height:46px;min-width:74px;display:inline-flex;align-items:center;justify-content:center;
 gap:6px;padding:10px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;
 font-size:17px;font-family:inherit;color:var(--ink);cursor:pointer;user-select:none}
.opt.stack{flex:1 1 100%;justify-content:flex-start;text-align:left}
.opt[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
body.mk .opt[aria-pressed="true"],body.gm .opt[aria-pressed="true"],body.lg .opt[aria-pressed="true"],body.rd .opt[aria-pressed="true"]{background:var(--acc2);border-color:var(--acc2)}
.opt.sym{font-size:24px;font-weight:700;min-width:64px}
.opt.big{font-size:26px;font-weight:700;min-width:88px;min-height:60px}
.opt.face{font-size:28px;min-width:74px;min-height:58px}
.opt.ltr{font-size:21px;font-weight:700;min-width:58px;min-height:52px}
.opt.tick{font-size:24px;font-weight:700;min-width:66px;min-height:52px}
.opt.half{flex:1 1 44%;justify-content:flex-start;text-align:left;font-size:16px;min-height:56px}
input.num{width:76px;min-height:46px;font-size:20px;text-align:center;border:1.5px solid var(--line);
 border-radius:10px;background:#fff;font-family:inherit;padding:6px}
input.wordin{width:150px;font-size:18px;text-align:left;padding:6px 10px}
input.num:focus,.namebar input:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:38px;margin-top:8px}
.op{font-size:22px;font-weight:700;color:var(--grey)}
.lbl{font-size:13px;color:var(--grey)}
.dots{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dot{width:20px;height:20px;border-radius:50%;background:#5b6672;flex:none}
.blocks{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap}
.units{display:grid;grid-template-columns:repeat(5,18px);gap:3px}
.unit{width:18px;height:18px;border:1px solid #6b7280;background:#e9ecef;border-radius:2px}
.long{width:18px;height:80px;border:1px solid #6b7280;background:#e9ecef;border-radius:2px;
 background-image:repeating-linear-gradient(to bottom,transparent 0 7px,#9aa3ad 7px 7.7px)}
.shape{background:#8a8a8a;border:1px solid #4a4a4a}
.glyph{font-size:30px;letter-spacing:2px}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1.5px dashed #b9c0c8;border-radius:9px;padding:8px 4px;font-size:12px;
 color:var(--grey);text-align:center;min-width:62px;background:#fbfcfd}
.chip b{display:block;font-size:11px;color:var(--acc)}
.given{font-size:18px;font-weight:600;min-width:112px}
.item.correct{background:#f1f9f3;border-radius:9px}
.item.wrong{background:#fdf3f2;border-radius:9px}
.mark{font-size:15px;font-weight:700;margin:7px 0 0 38px;display:none}
.item.correct .mark{display:block;color:var(--ok)}
.item.wrong .mark{display:block;color:var(--no)}
.opt.gotit{border-color:var(--ok);background:#e6f4ea;color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
 padding:11px 14px calc(11px + env(safe-area-inset-bottom));display:flex;gap:10px;
 align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 -2px 10px rgba(0,0,0,.05);z-index:10}
.btn{min-height:48px;padding:12px 20px;border-radius:11px;border:1.5px solid var(--acc);
 background:var(--acc);color:#fff;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer}
.btn.ghost{background:#fff;color:var(--acc)}
.score{font-size:17px;font-weight:700;color:var(--acc);min-width:118px;text-align:center}
.note{font-size:13px;color:var(--grey);margin:16px 0 0;padding:12px;background:#fff8e6;
 border:1px solid #f0e0b0;border-radius:10px}
.hide{display:none}
</style>
</head>
<body class="mt">

<header>
  <div class="wrap">
    <h1>GRADE 1 — TERM 1 REVIEWER</h1>
    <p id="subt">Mathematics &bull; Weeks 1&ndash;8</p>
    <div class="namebar">
      <label>Name<input id="nm" type="text" autocomplete="off"></label>
      <label>Date<input id="dt" type="text" autocomplete="off"></label>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-s="mt">Mathematics</button>
    <button class="tab" data-s="mk">Makabansa</button>
    <button class="tab" data-s="gm">GMRC</button>
    <button class="tab" data-s="lg">Language</button>
    <button class="tab" data-s="rd">Reading</button>

const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const F={mt:[],mk:[],gm:[],lg:[],rd:[]};

function shapeNode(s,w,h){const d=el('div','shape');d.style.width=w+'px';d.style.height=h+'px';
 if(s==='tri'){d.style.border='0';d.style.clipPath='polygon(50% 0,100% 100%,0 100%)';
 d.style.webkitClipPath='polygon(50% 0,100% 100%,0 100%)';}return d;}
function dotsNode(n,sz){const d=el('div','dots');for(let i=0;i<n;i++){const o=el('div','dot');
 if(sz){o.style.width=sz+'px';o.style.height=sz+'px';}d.appendChild(o);}return d;}
function blocksNode(L,U){const w=el('div','blocks');for(let i=0;i<L;i++)w.appendChild(el('div','long'));
 if(U>0){const u=el('div','units');for(let i=0;i<U;i++)u.appendChild(el('div','unit'));w.appendChild(u);}return w;}
function numIn(c){const i=document.createElement('input');i.type='text';i.className='num'+(c?' '+c:'');
 i.setAttribute('inputmode',c==='wordin'?'text':'numeric');i.autocomplete='off';
 i.autocapitalize='off';i.spellcheck=false;return i;}
function picChip(label){const w=el('div','');w.style.margin='8px 0 0 38px';
 const c=el('div','chip',label);c.style.minWidth='120px';c.style.display='inline-block';
 w.appendChild(c);return w;}
function optGroup(labels,cls,st){const box=el('div','opts');
 const btns=labels.map(L=>{const b=document.createElement('button');b.type='button';
  b.className='opt'+(cls?' '+cls:'')+(st?' stack':'');b.setAttribute('aria-pressed','false');
  if(typeof L==='string')b.innerHTML=L;else b.appendChild(L);
  b.onclick=()=>{btns.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');};
  box.appendChild(b);return b;});
 return {box,btns,sel:()=>btns.findIndex(b=>b.getAttribute('aria-pressed')==='true')};}

function makeItem(idx,it,bank){
 const wrap=el('div','item'), head=el('div','q');
 head.appendChild(el('span','n',(idx+1)+'.'));
 const body=el('span','',''); head.appendChild(body); wrap.appendChild(head);
 const mark=el('div','mark','');
 let check=null,reveal=null;
 const simple=(labels,cls,ans,st)=>{const g=optGroup(labels,cls,st);wrap.appendChild(g.box);
   check=()=>g.sel()===ans; reveal=()=>{if(ans>=0)g.btns[ans].classList.add('gotit');};};

 switch(it.t){
  case 'mcq': body.innerHTML=it.q;
    {const g=optGroup(it.o,null,it.st);wrap.appendChild(g.box);
     check=()=>it.skip?null:(g.sel()===it.a);
     reveal=()=>{if(it.a>=0)g.btns[it.a].classList.add('gotit');};}
    break;
  case 'mcqfig': body.innerHTML=it.q;
    {const nodes=it.o.map(o=>{const s=el('span','');s.style.display='inline-flex';
      s.style.alignItems='center';s.style.gap='8px';s.appendChild(el('span','',o.l));
      s.appendChild(shapeNode(o.s,o.w,o.h));return s;});
     simple(nodes,null,it.a);}
    break;
  case 'face': body.innerHTML=it.q; simple(['\u263A','\u2639'],'face',it.a); break;
  case 'tm':   body.innerHTML=it.q; simple(['TAMA','MALI'],null,it.a); break;
  case 'tm2':  body.innerHTML=it.q; simple(['T','M'],'ltr',it.a); break;
  case 'hrt':  body.innerHTML=it.q; simple(['\u2665','\u2717'],'tick',it.a); break;
  case 'kh':   body.innerHTML=it.q; if(it.pic)wrap.appendChild(picChip(it.q));
               simple(['K','H'],'ltr',it.a); break;
  case 'tick': body.innerHTML=it.q; if(it.pic)wrap.appendChild(picChip(it.q));
               simple(['\u2713','\u2717'],'tick',it.a); break;
  case 'ltr':  body.innerHTML=it.q; simple(it.o,'ltr',it.a); break;
  case 'lhk':  body.innerHTML=it.q+' &nbsp;<span class="glyph">'+it.g+'</span>';
               simple(['L','H','K'],'ltr',it.a); break;
  case 'two':  body.innerHTML=it.q||''; simple(it.o,'half',it.a); break;
  case 'pick': body.innerHTML='';
    {const g=optGroup(it.p.map(String),'big');g.box.style.margin='0';head.appendChild(g.box);
     check=()=>g.sel()===it.a; reveal=()=>g.btns[it.a].classList.add('gotit');}
    break;
  case 'sym': body.innerHTML='<span style="font-size:24px;font-weight:700">'+it.p[0]+
      '&nbsp;&nbsp;____&nbsp;&nbsp;'+it.p[1]+'</span>';
    simple(['&gt;','&lt;','='],'sym',it.a); break;
  case 'word':
    {const s=el('div','');s.style.display='flex';s.style.alignItems='center';
     s.style.gap='14px';s.style.flexWrap='wrap';
     s.appendChild(dotsNode(it.p[0],20));s.appendChild(el('span','lbl','____'));
     s.appendChild(dotsNode(it.p[1],20));body.appendChild(s);
     simple(['more than','less than','as many as'],null,it.a);}
    break;
  case 'arw': body.innerHTML='<span style="font-size:20px;font-weight:600">'+it.v+' &rarr;</span>';
    {const r=el('div','row'),i=numIn();r.appendChild(i);wrap.appendChild(r);
     check=()=>parseInt(i.value,10)===it.a; reveal=()=>{if(!i.value)i.placeholder=it.a;};}
    break;

    {const r=el('div','row'),a=numIn(),b=numIn('wordin');b.placeholder='number word';
     r.appendChild(el('span','lbl','symbol'));r.appendChild(a);
     r.appendChild(el('span','lbl','number word'));r.appendChild(b);wrap.appendChild(r);
     check=()=>parseInt(a.value,10)===it.a&&(b.value||'').trim().toLowerCase()===it.w;
     reveal=()=>{if(!a.value)a.placeholder=it.a;if(!b.value)b.placeholder=it.w;};}
    break;
  case 'blk': body.appendChild(blocksNode(it.L,it.U));
    {const r=el('div','row'),i=numIn();r.appendChild(i);wrap.appendChild(r);
     check=()=>parseInt(i.value,10)===it.a; reveal=()=>{if(!i.value)i.placeholder=it.a;};}
    break;
  case 'spl': body.appendChild(blocksNode(it.L,it.U));
    {const r=el('div','row'),a=numIn(),b=numIn(),c=numIn();
     r.appendChild(el('span','lbl','longs'));r.appendChild(a);
     r.appendChild(el('span','lbl','units'));r.appendChild(b);
     r.appendChild(el('span','lbl','number'));r.appendChild(c);wrap.appendChild(r);
     check=()=>parseInt(a.value,10)===it.L&&parseInt(b.value,10)===it.U&&
               parseInt(c.value,10)===it.L*10+it.U;
     reveal=()=>{if(!a.value)a.placeholder=it.L;if(!b.value)b.placeholder=it.U;
                 if(!c.value)c.placeholder=it.L*10+it.U;};}
    break;
  case 'ord': body.innerHTML='<span class="given">'+it.g.join(',&nbsp; ')+'</span>';
    {const r=el('div','row'),ins=[0,1,2,3].map(()=>{const i=numIn();r.appendChild(i);return i;});
     wrap.appendChild(r);
     check=()=>ins.every((i,k)=>parseInt(i.value,10)===it.a[k]);
     reveal=()=>ins.forEach((i,k)=>{if(!i.value)i.placeholder=it.a[k];});}
    break;
  case 'ca':
    {const s=el('div','');s.style.display='flex';s.style.alignItems='center';
     s.style.gap='12px';s.style.flexWrap='wrap';
     s.appendChild(dotsNode(it.p[0],22));s.appendChild(el('span','lbl','and'));
     s.appendChild(dotsNode(it.p[1],22));s.appendChild(el('span','op','='));
     const i=numIn();s.appendChild(i);body.appendChild(s);
     check=()=>parseInt(i.value,10)===it.a; reveal=()=>{if(!i.value)i.placeholder=it.a;};}
    break;
  case 'seq':
    {const r=el('div','row');r.style.marginLeft='38px';
     const ins=[];
     it.s.forEach((v,k)=>{
       if(k) r.appendChild(el('span','op',','));
       if(v===null){const i=numIn();i.style.width='64px';r.appendChild(i);ins.push({i,k});}
       else r.appendChild(el('span','','<span style="font-size:20px;font-weight:600">'+v+'</span>'));
     });
     wrap.appendChild(r);
     // the sequence counts up by one from the first known value
     const base=it.s.findIndex(v=>v!==null), bv=it.s[base];
     const want=k=>bv+(k-base);
     check=()=>ins.every(o=>parseInt(o.i.value,10)===want(o.k));
     reveal=()=>ins.forEach(o=>{if(!o.i.value)o.i.placeholder=want(o.k);});}
    break;
  case 'cnt':
    {const r=el('div','row');
     r.appendChild(el('div','chip',it.lbl));
     const i=numIn();r.appendChild(i);wrap.appendChild(r);
     check=()=>parseInt(i.value,10)===it.a; reveal=()=>{if(!i.value)i.placeholder=it.a;};}
    break;
  case 'txt': body.innerHTML=it.q;
    {const r=el('div','row');const i=numIn('wordin');
     i.placeholder=it.loose?'salita':'name';
     r.appendChild(i);wrap.appendChild(r);
     const norm=s=>(s||'').trim().toLowerCase()
       .replace(/\u00F1/g,'n').replace(/\u00E1|\u00E0/g,'a').replace(/\u00E9/g,'e');
     check=()=> it.loose ? norm(i.value)===norm(it.a)
                         : (i.value||'').trim().toLowerCase()===it.a.toLowerCase();
     reveal=()=>{if(!i.value)i.placeholder=it.a;};}
    break;
  case 'comm':
    body.innerHTML='<span style="font-size:20px;font-weight:600">'+it.p[0]+' + '+it.p[1]+' =</span>';
    {const r=el('div','row');const a=numIn(),b=numIn();
     r.appendChild(a);r.appendChild(el('span','op','+'));r.appendChild(b);
     wrap.appendChild(r);
     check=()=>parseInt(a.value,10)===it.p[1]&&parseInt(b.value,10)===it.p[0];
     reveal=()=>{if(!a.value)a.placeholder=it.p[1];if(!b.value)b.placeholder=it.p[0];};}
    break;
  case 'ca3':
    {const s=el('div','');s.style.display='flex';s.style.alignItems='center';
     s.style.gap='10px';s.style.flexWrap='wrap';
     s.appendChild(dotsNode(it.p[0],20));s.appendChild(el('span','op','+'));
     s.appendChild(dotsNode(it.p[1],20));s.appendChild(el('span','op','+'));
     s.appendChild(dotsNode(it.p[2],20));s.appendChild(el('span','op','='));
     const i=numIn();s.appendChild(i);body.appendChild(s);
     check=()=>parseInt(i.value,10)===it.a; reveal=()=>{if(!i.value)i.placeholder=it.a;};}
    break;
  case 'sum': body.innerHTML='<span style="font-size:21px">'+it.p[0]+' + '+it.p[1]+' =</span>';
    {const r=el('div','row'),i=numIn();r.appendChild(i);wrap.appendChild(r);
     check=()=>parseInt(i.value,10)===it.a; reveal=()=>{if(!i.value)i.placeholder=it.a;};}
    break;
  case 'apic':
    {const s=el('div','');s.style.display='flex';s.style.alignItems='center';
     s.style.gap='10px';s.style.flexWrap='wrap';
     s.appendChild(dotsNode(it.p[0],18));s.appendChild(el('span','op','+'));
     s.appendChild(dotsNode(it.p[1],18));body.appendChild(s);
     const r=el('div','row'),a=numIn(),b=numIn(),c=numIn();
     r.appendChild(a);r.appendChild(el('span','op','+'));r.appendChild(b);
     r.appendChild(el('span','op','='));r.appendChild(c);wrap.appendChild(r);
     check=()=>parseInt(a.value,10)===it.p[0]&&parseInt(b.value,10)===it.p[1]&&
               parseInt(c.value,10)===it.p[0]+it.p[1];
     reveal=()=>{if(!a.value)a.placeholder=it.p[0];if(!b.value)b.placeholder=it.p[1];
                 if(!c.value)c.placeholder=it.p[0]+it.p[1];};}
    break;
 }
 wrap.appendChild(mark);
 bank.push({wrap,mark,check,reveal});
 return wrap;
}

function build(data,mount,bank){
 data.forEach(W=>{
  mount.appendChild(el('div','weekbar',W.week));
  W.sheets.forEach(S=>{
   const card=el('div','sheet');
   card.appendChild(el('h3','',S.t));
   card.appendChild(el('div','dir',S.d));
   if(S.fig){const f=el('div','');f.style.textAlign='center';f.style.margin='4px 0 12px';
    const n=shapeNode(S.fig.s,S.fig.w,S.fig.h);n.style.display='inline-block';
    f.appendChild(n);card.appendChild(f);}
   if(S.bx) card.appendChild(el('div','box',S.bx));
   if(S.strip){const st=el('div','strip');
    S.strip.forEach((o,i)=>st.appendChild(el('div','chip','<b>'+(i+1)+'</b>'+o)));
    card.appendChild(st);}
   S.items.forEach((it,i)=>card.appendChild(makeItem(i,it,bank)));
   mount.appendChild(card);
  });
 });
}
build(MATH,document.getElementById('mt'),F.mt);
build(MK,document.getElementById('mk'),F.mk);
build(GM,document.getElementById('gm'),F.gm);
build(LG,document.getElementById('lg'),F.lg);
build(RD,document.getElementById('rd'),F.rd);

const SUB={mt:'Mathematics &bull; Weeks 1&ndash;8',mk:'Makabansa &bull; Weeks 1&ndash;10',gm:'GMRC &bull; Weeks 1&ndash;10',lg:'Language &bull; Week 10',rd:'Reading &bull; Weeks 9&ndash;10'};

function show(s){
 cur=s;
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.s===s));
 ['mt','mk','gm','lg','rd'].forEach(k=>document.getElementById(k).classList.toggle('hide',k!==s));
 document.body.className=s;
 document.getElementById('subt').innerHTML=SUB[s];
 document.getElementById('nt').innerHTML=NOTE[s];
 document.getElementById('score').innerHTML='&mdash;';
 window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.s));
show('mt');

/* ---------- check / reset ---------- */
document.getElementById('check').onclick=()=>{
 let right=0,total=0;
 F[cur].forEach(f=>{
  f.wrap.classList.remove('correct','wrong');
  const r=f.check?f.check():null;
  if(r===null){f.mark.textContent='';return;}
  total++;
  if(r){right++;f.wrap.classList.add('correct');f.mark.textContent='\u2713 Correct';}
  else{f.wrap.classList.add('wrong');f.mark.textContent='\u2717 Try again';if(f.reveal)f.reveal();}
 });
 document.getElementById('score').textContent=right+' / '+total;
 window.scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('reset').onclick=()=>{
 if(!confirm('Clear all answers on this subject and start over?'))return;
 const root=document.getElementById(cur);
 root.querySelectorAll('input').forEach(i=>{i.value='';i.placeholder='';});
 root.querySelectorAll('.opt').forEach(b=>{b.setAttribute('aria-pressed','false');b.classList.remove('gotit');});
 F[cur].forEach(f=>{f.wrap.classList.remove('correct','wrong');f.mark.textContent='';});
 document.getElementById('score').innerHTML='&mdash;';
 window.scrollTo({top:0,behavior:'smooth'});
};

/* ---------- keep answers across accidental refreshes ---------- */
try{
 const KEY='g1_term1_reviewer';
 const ins=()=>[...document.querySelectorAll('input')];
 const ops=()=>[...document.querySelectorAll('.opt')];
 const save=()=>localStorage.setItem(KEY,JSON.stringify(
   {i:ins().map(x=>x.value),o:ops().map(x=>x.getAttribute('aria-pressed'))}));
 const raw=localStorage.getItem(KEY);
 if(raw){const d=JSON.parse(raw),I=ins(),O=ops();
  if(d.i&&d.i.length===I.length)d.i.forEach((v,k)=>I[k].value=v);
  if(d.o&&d.o.length===O.length)d.o.forEach((v,k)=>O[k].setAttribute('aria-pressed',v));}
 document.addEventListener('input',save);
 document.addEventListener('click',e=>{if(e.target.closest('.opt'))save();});
 document.getElementById('reset').addEventListener('click',()=>{try{localStorage.removeItem(KEY);}catch(e){}});
}catch(e){}
</script>
