<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Learning</title>
<meta name="theme-color" content="#FFF7EC">
<style>
  :root {
    --bg: #FFF7EC;
    --ink: #3A2E22;
    --muted: #8A7A66;
    --card: #FFFFFF;
    --line: #EADFCE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: min(100%, 30rem);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
  }
  h1 { margin: 0 0 6px; font-size: 1.5rem; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Learning</h1>
  <p>Placeholder. The learning app will live in this folder.</p>
</main>
</body>
</html>
